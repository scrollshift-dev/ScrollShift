name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSCROLLSHIFT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell syntax and lint
        run: |
          sh -n packaging/install.sh packaging/download.sh packaging/update.sh packaging/uninstall.sh
          shellcheck packaging/install.sh packaging/download.sh packaging/update.sh packaging/uninstall.sh
      - name: Installer checksum failure cases
        run: sh -eu tests/installer_checksum_tests.sh
      - name: Release verification partial cases
        run: |
          sh -n scripts/verify_release.sh
          shellcheck scripts/verify_release.sh tests/release_verify_tests.sh
          sh -eu tests/release_verify_tests.sh
      - name: Workflow checkout regression check
        run: python3 scripts/check_workflow_checkout.py .github/workflows/release.yml .github/workflows/ci.yml
