name: Release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCROLLSHIFT_WARNINGS_AS_ERRORS=ON
          cmake --build build -j2
          ./build/scrollshift --version
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./build/scrollshift --version | sed -E 's/^scrollshift ([^ ]+)$/\1/')" = "$version"
          root="scrollshift-$version-${{ matrix.platform }}"
          mkdir "$root"
          cp build/scrollshift README.md LICENSE "$root/"
          cp -r packaging "$root/"
          tar -czf "$root.tar.gz" "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: scrollshift-*.tar.gz

  installer-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public scripts
        run: |
          for script in packaging/install.sh packaging/download.sh packaging/update.sh packaging/uninstall.sh; do
            sh -n "$script"
          done
      - name: Installer checksum failure cases
        run: sh -eu tests/installer_checksum_tests.sh

  website-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public website scripts match packaging copies before publication
        run: |
          for script in install.sh download.sh update.sh uninstall.sh; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://scrollshift.dev/$script" -o "/tmp/$script"
            cmp "packaging/$script" "/tmp/$script"
            sh -n "/tmp/$script"
          done

  publish:
    needs: [linux, installer-preflight, website-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum scrollshift-* > SHA256SUMS
      - name: Verify expected assets before publication
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cd dist
          test "$(ls scrollshift-*.tar.gz | wc -l)" = "2"
          for archive in scrollshift-*; do
            case "$archive" in
              scrollshift-"$version"-linux-x86_64.tar.gz|scrollshift-"$version"-linux-aarch64.tar.gz) ;;
              *) echo "unexpected archive in dist: $archive" >&2; exit 1;;
            esac
          done
          awk '{ if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/) { print "bad checksum line: " $0 > "/dev/stderr"; exit 1 } }' SHA256SUMS
          for archive in scrollshift-*; do
            expected=$(awk -v f="$archive" '$2==f {print $1}' SHA256SUMS)
            actual=$(sha256sum "$archive" | awk '{print $1}')
            test "$actual" = "$expected"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            version="${GITHUB_REF_NAME#v}"
            cd dist
            ok=1
            for platform in linux-x86_64 linux-aarch64; do
              archive="scrollshift-$version-$platform.tar.gz"
              if ! gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -qx "$archive"; then
                echo "Existing release is missing $archive; refusing to leave a partial release" >&2
                ok=0
                continue
              fi
              gh release download "$GITHUB_REF_NAME" --pattern "$archive" --clobber -D /tmp/release-verify
              expected=$(awk -v f="$archive" '$2==f {print $1}' SHA256SUMS)
              actual=$(sha256sum "/tmp/release-verify/$archive" | awk '{print $1}')
              if [ "$actual" != "$expected" ]; then
                echo "Existing release asset $archive checksum mismatch" >&2
                ok=0
              fi
            done
            if [ "$ok" -eq 1 ]; then
              echo "Existing release already has the complete expected asset set with correct checksums; leaving it untouched"
            else
              echo "Existing release is incomplete or inconsistent; fix it manually before retrying" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

  installer-public-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tagged release through public download script
        run: |
          curl -fsSL https://scrollshift.dev/download.sh -o /tmp/download.sh
          sh -n /tmp/download.sh
          version="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP"
          SCROLLSHIFT_VERSION="$version" sh /tmp/download.sh --output scrollshift
          test "$(./scrollshift --version | sed -E 's/^scrollshift ([^ ]+)$/\1/')" = "$version"
      - name: Fetch and verify public scripts as published
        run: |
          for script in install.sh download.sh update.sh uninstall.sh; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://scrollshift.dev/$script" -o "/tmp/$script"
            cmp "packaging/$script" "/tmp/$script"
            sh -n "/tmp/$script"
          done