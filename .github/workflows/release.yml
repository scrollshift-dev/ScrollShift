name: Release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ./build/scrollshift --version
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./build/scrollshift --version | sed -E 's/^scrollshift ([^ ]+)$/\1/')" = "$version"
          root="scrollshift-$version-${{ matrix.platform }}"
          mkdir "$root"
          cp build/scrollshift README.md LICENSE "$root/"
          cp -r packaging "$root/"
          tar -czf "$root.tar.gz" "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: scrollshift-*.tar.gz

  installer-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public scripts
        run: |
          for script in packaging/install.sh packaging/download.sh packaging/update.sh packaging/uninstall.sh; do
            sh -n "$script"
          done

  publish:
    needs: [linux, installer-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum scrollshift-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; leaving its published assets unchanged"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

  installer-public-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify public scripts
        run: |
          for script in install.sh download.sh update.sh uninstall.sh; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://scrollshift.dev/$script" -o "/tmp/$script"
            cmp "packaging/$script" "/tmp/$script"
            sh -n "/tmp/$script"
          done
      - name: Download tagged release through public download script
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP"
          SCROLLSHIFT_VERSION="$version" sh /tmp/download.sh --output scrollshift
          test "$(./scrollshift --version | sed -E 's/^scrollshift ([^ ]+)$/\1/')" = "$version"
