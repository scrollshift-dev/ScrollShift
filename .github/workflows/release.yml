name: Release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCROLLSHIFT_WARNINGS_AS_ERRORS=ON
          cmake --build build -j2
          ./build/scrollshift --version
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Stage archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./build/scrollshift --version | sed -E 's/^scrollshift ([^ ]+)$/\1/')" = "$version"
          root="scrollshift-$version-${{ matrix.platform }}"
          mkdir "$root"
          cp build/scrollshift README.md LICENSE "$root/"
          cp -r packaging "$root/"
          tar -czf "$root.tar.gz" "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: scrollshift-*.tar.gz

  installer-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public scripts
        run: |
          for script in packaging/install.sh packaging/download.sh packaging/update.sh packaging/uninstall.sh; do
            sh -n "$script"
          done
      - name: Installer checksum failure cases
        run: sh -eu tests/installer_checksum_tests.sh
      - name: Release verification partial cases
        run: |
          sh -n scripts/verify_release.sh
          sh -eu tests/release_verify_tests.sh

  website-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public website scripts match packaging copies before publication
        run: |
          for script in install.sh download.sh update.sh uninstall.sh; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://scrollshift.dev/$script" -o "/tmp/$script"
            cmp "packaging/$script" "/tmp/$script"
            sh -n "/tmp/$script"
          done

  publish:
    needs: [linux, installer-preflight, website-parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum scrollshift-* > SHA256SUMS
      - name: Verify candidate release asset set
        run: sh scripts/verify_release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # An existing release is accepted only when it is already exactly
            # usable by the public verified installer. Two layers of invariants:
            #   1. the complete published asset-name set is exactly the expected
            #      public set (the two archives plus SHA256SUMS), checked by
            #      verify_release.sh --published against the full GitHub asset
            #      list, so an unexpected/stale extra asset is rejected;
            #   2. the three expected assets' contents satisfy
            #      scripts/verify_release.sh and the published manifest is
            #      byte-identical to the candidate manifest.
            # Published releases are never auto-repaired; any inconsistency
            # fails loudly.
            gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | sort > /tmp/published-names
            sh scripts/verify_release.sh --published "$version" "$GITHUB_REF_NAME" /tmp/published-names
            rm -rf /tmp/published && mkdir -p /tmp/published
            for asset in "scrollshift-$version-linux-x86_64.tar.gz" "scrollshift-$version-linux-aarch64.tar.gz" "SHA256SUMS"; do
              gh release download "$GITHUB_REF_NAME" --pattern "$asset" --clobber -D /tmp/published
            done
            sh scripts/verify_release.sh "$version" /tmp/published
            if ! cmp -s dist/SHA256SUMS /tmp/published/SHA256SUMS; then
              echo "Existing release manifest differs from the candidate manifest; refusing to accept it" >&2
              exit 1
            fi
            echo "Existing release is exactly usable by the public verified installer; leaving it untouched"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

  installer-public-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tagged release through public download script
        run: |
          curl -fsSL https://scrollshift.dev/download.sh -o /tmp/download.sh
          sh -n /tmp/download.sh
          version="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP"
          SCROLLSHIFT_VERSION="$version" sh /tmp/download.sh --output scrollshift
          test "$(./scrollshift --version | sed -E 's/^scrollshift ([^ ]+)$/\1/')" = "$version"
      - name: Fetch and verify public scripts as published
        run: |
          for script in install.sh download.sh update.sh uninstall.sh; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://scrollshift.dev/$script" -o "/tmp/$script"
            cmp "packaging/$script" "/tmp/$script"
            sh -n "/tmp/$script"
          done